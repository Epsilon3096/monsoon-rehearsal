[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "monsoon-rehearsal"
version = "0.8.1"
description = "Reproducible drainage maintenance planning with EPA SWMM"
requires-python = ">=3.11,<3.14"
dependencies = ["streamlit==1.65.0", "plotly==7.1.0", "swmm-toolkit==0.17.0", "pandas==3.0.6", "numpy==2.5.4"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["monsoon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["hydraulic: executes the real EPA SWMM engine", "integration: exercises multiple components"]
