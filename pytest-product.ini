[pytest]
# Explicit SWMM product scope. Experimental bench tests remain in tests/ and in
# the default full-suite collection; they are NOT qualified by this profile.
# The known v0.7 hydraulic accuracy failure remains failed.
testpaths = tests
pythonpath = .
addopts = --ignore-glob=tests/test_bench*.py
markers =
    hydraulic: executes the real EPA SWMM engine
    integration: exercises multiple components
